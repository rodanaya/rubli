name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest, no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      # Error-class rules only (syntax errors, undefined names); style is not enforced yet.
      - run: ruff check backend --select E9,F63,F7,F82
      - run: python -m compileall -q backend
      # The multi-GB database is not in the repo; tests that need it skip with a reason.
      - run: python -m pytest tests/ -q --tb=short -p no:cacheprovider
        working-directory: backend

  frontend:
    name: Frontend (tsc + build + token lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint:tokens
      - run: npm run build
      - run: npm run test:run
